version: "2"
linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        # Closing read-only handles has nothing to report.
        - (io.Closer).Close
        - (*os.File).Close
        - (*archive/zip.ReadCloser).Close
        - (io/fs.File).Close
        - (*net/http.Server).Close
        - fmt.Fprint
formatters:
  enable:
    - gofmt
