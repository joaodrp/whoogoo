# Contributor setup. Users install the CLI instead: see README.
[tools]
java = "21"
python = "3"

[tasks.test]
run = "python3 -m unittest discover -s tests -v"

[tasks.apk]
description = "Build the importer APK"
run = "./gradlew -q assembleDebug"

[tasks.dev]
description = "Run the CLI from source, e.g. mise run dev -- import --apk app/build/outputs/apk/debug/app-debug.apk export.zip"
run = "python3 -m whoogoo"
