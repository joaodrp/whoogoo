# Contributor setup. Users install the binary instead: see README.
[tools]
go = "1.25"
java = "21"
golangci-lint = "2"
ktlint = "1"
lefthook = "2"
gitleaks = "8"

[tasks.hooks]
description = "Install the git hooks (once per clone)"
run = "git config core.hooksPath .git/hooks && lefthook install"

[tasks.fmt]
run = "gofmt -w . && ktlint -F 'app/src/**/*.kt' '*.kts' 'app/*.kts'"

[tasks.lint]
run = "golangci-lint run && ktlint 'app/src/**/*.kt' '*.kts' 'app/*.kts'"

[tasks.test]
run = "go vet ./... && go test ./... && ./gradlew -q testDebugUnitTest"

[tasks.check]
description = "Lint and tests, what CI runs before building the APK"
depends = ["lint", "test"]

[tasks.build]
run = "go build -o whoogoo ."

[tasks.apk]
description = "Build the app APK"
run = "./gradlew -q assembleDebug"

[tasks.dev]
description = "Run the CLI from source, e.g. mise run dev -- import --apk app/build/outputs/apk/debug/app-debug.apk export.zip"
run = "go run ."
