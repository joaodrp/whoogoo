[project]
name = "whoogoo"
version = "0.1.0"
description = "Import a WHOOP data export into Google Health through Android Health Connect"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "João Pereira" }]
keywords = ["whoop", "google-health", "health-connect", "fitbit"]

[project.urls]
Repository = "https://github.com/joaodrp/whoogoo"

[project.scripts]
whoogoo = "whoogoo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whoogoo"]
